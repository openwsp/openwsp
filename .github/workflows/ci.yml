name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked CPU dependencies
        run: uv sync --locked --extra dev --extra modal --extra replication
      - name: Check tracked files for credentials
        run: uv run --no-sync python scripts/check_secrets.py --all
      - name: Run CPU and MCP client tests
        run: uv run --no-sync pytest -q
      - name: Check command entry points
        run: |
          uv run --no-sync openwsp --help
          uv run --no-sync openwsp-mcp --help
