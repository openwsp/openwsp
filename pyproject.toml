[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openwsp"
version = "0.1.0"
description = "Open tooling for weight space programming"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1", "safetensors>=0.5", "torch>=2.6", "mcp>=1.12,<2", "typer>=0.16"]

[project.optional-dependencies]
modal = ["modal[api-proxy-support]>=1.6.3", "openai>=3.42.1", "huggingface-hub>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]
replication = ["transformers==5.17.0", "math-verify==0.9.0", "datasets>=4", "scipy>=1.15", "scikit-learn>=1.6", "pandas>=2.2", "sympy>=1.13", "networkx>=3.4", "absl-py>=2", "langdetect>=1.0.9", "nltk>=3.9", "immutabledict>=4"]

[project.scripts]
openwsp = "openwsp.cli:main"
openwsp-mcp = "openwsp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openwsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["replications/*/vendor/**"]
force-exclude = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
